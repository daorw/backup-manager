name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="backup-manager-${GOOS}-${GOARCH}${ext}"
          go build -ldflags="-s -w" -o "$out" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: backup-manager-*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat > release-notes.md <<- RELEASENOTES
          ## Backup Manager ${TAG}

          ### Changes since last release
          
          RELEASENOTES

          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            git log --oneline --no-decorate "${PREV_TAG}..${TAG}" >> release-notes.md
          else
            git log --oneline --no-decorate >> release-notes.md
          fi

          cat >> release-notes.md <<- RELEASENOTES

          ### Downloads

          | File | Size |
          |------|------|
          RELEASENOTES

          for f in artifacts/*; do
            name="$(basename "$f")"
            size="$(du -h "$f" | cut -f1)"
            echo "| \`${name}\` | ${size} |" >> release-notes.md
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Backup Manager ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
          draft: false
          prerelease: false
