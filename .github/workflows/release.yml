name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build binary
        run: |
          out="backup-manager-${GOOS}-${GOARCH}"
          go build -ldflags="-s -w" -o "$out" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.goarch }}
          path: backup-manager-linux-*
          if-no-files-found: error

  build-darwin:
    name: Build (darwin/${{ matrix.goarch }})
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      GOOS: darwin
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build binary
        run: |
          out="backup-manager-${GOOS}-${GOARCH}"
          go build -ldflags="-s -w" -o "$out" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.goarch }}
          path: backup-manager-darwin-*
          if-no-files-found: error

  build-windows:
    name: Build (windows/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64]
    env:
      GOOS: windows
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build binary
        run: |
          out="backup-manager-${GOOS}-${GOARCH}.exe"
          go build -ldflags="-s -w" -o "$out" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.goarch }}
          path: backup-manager-windows-*.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat > release-notes.md <<- RELEASENOTES
          ## Backup Manager ${TAG}

          ### Changes since last release

          RELEASENOTES

          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            git log --oneline --no-decorate "${PREV_TAG}..${TAG}" >> release-notes.md
          else
            git log --oneline --no-decorate >> release-notes.md
          fi

          cat >> release-notes.md <<- RELEASENOTES

          ### Downloads

          | File | Size |
          |------|------|
          RELEASENOTES

          for f in artifacts/*; do
            name="$(basename "$f")"
            size="$(du -h "$f" | cut -f1)"
            echo "| \`${name}\` | ${size} |" >> release-notes.md
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Backup Manager ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
          draft: false
          prerelease: false
