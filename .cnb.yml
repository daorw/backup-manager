# Tag 发版流水线 —— 对应 .github/workflows/release.yml 中的非 darwin 部分。
#
# 触发：推送任意 Tag（等价于 GH 的 on.push.tags: ['*']）
# 产物：linux/amd64、linux/arm64、windows/amd64 三个二进制，作为 Release 附件上传
#
# 说明：darwin（amd64/arm64）不在这里构建 —— github.com/getlantern/systray 在 macOS 上
# 依赖 CGO，无法从 Linux 交叉编译，而 CNB 只有 Linux 构建节点（Mac 需根组织自托管）。
# 两个 macOS 产物仍由 GitHub Actions 负责。

"$":
  tag_push:
    - name: release
      docker:
        image: golang:1.26.2 # 与 go.mod 的 go 指令保持一致
        volumes:
          - /root/go/pkg/mod # module 缓存
          - /root/.cache/go-build # 编译缓存
      env:
        GOPROXY: https://goproxy.cn,direct
      lock:
        key: release-$CNB_BRANCH # 同一个 tag 被重复推送时只保留最新一次
        wait: true
        cancel-in-wait: true
      stages:
        - name: build-frontend
          image: node:22 # 前端与 Go 用不同镜像，Stage 级覆盖 Pipeline 镜像
          script: |
            cd frontend
            npm ci
            npm run build   # 产出 frontend/dist，供 main.go 的 go:embed 打包进二进制

        - name: build-binaries
          script: |
            set -euo pipefail
            mkdir -p dist
            for target in linux/amd64 linux/arm64 windows/amd64; do
              os="${target%/*}"
              arch="${target#*/}"
              ext=""
              if [ "$os" = "windows" ]; then ext=".exe"; fi
              echo "==> $os/$arch"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -ldflags="-s -w" -o "dist/backup-manager-$os-$arch$ext" .
            done
            ls -lh dist

        - name: generate-release-notes
          script: |
            set -euo pipefail
            tag="$CNB_BRANCH"
            {
              echo "## Backup Manager $tag"
              echo
              echo "### Changes since last release"
              echo
              prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
              if [ -n "$prev" ]; then
                git log --oneline --no-decorate "$prev..$tag"
              else
                git log --oneline --no-decorate -20
              fi
            } > release-notes.md
            cat release-notes.md

        - name: publish-release
          type: git:release
          options:
            tag: $CNB_BRANCH
            descriptionFromFile: release-notes.md

        - name: upload-attachments
          image: cnbcool/attachments:latest
          # tag_push 事件下插件自动用 $CNB_BRANCH 作为目标 release，
          # 因此必须在 publish-release 之后执行
          settings:
            attachments:
              - ./dist/backup-manager-linux-amd64
              - ./dist/backup-manager-linux-arm64
              - ./dist/backup-manager-windows-amd64.exe
